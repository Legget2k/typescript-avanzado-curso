<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Drag and Drop Example</h1>
        
        <div class="drop-wrapper">
            <div class="dropzone" id="dropzone">Drop here</div>
            <div class="dropzone" id="dropzoneTwo">Drop here too</div>
        </div>

        <div class="drag-wrapper">
            <div class="draggable" id="draggable" draggable="true">Drag me!</div>
            <div class="draggable" id="draggable2" draggable="true">Drag me too!</div>
        </div>

        <div class="localStorage-wrapper">
            <h2>Local Storage Content</h2>
            <div id="localStorageItems"></div>
        </div>
        <button id="reset-localstorage">Reiniciar LocalStorage</button>
    </div>

    <script src="./script.js"></script>
</body>
</html>
